<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #E6E6E9; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #E8EAED; }
    a { color: oklch(76.9% 0.166 70.1); } a:hover { color: oklch(83% 0.166 70.1); }
    .widget { box-sizing: border-box; width: 360px; height: 180px; border-radius: 22px; background: #0D0E11; overflow: hidden;
      display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 12px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.14) inset, 0 18px 44px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25); }
    .haut { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 0; }
    .infos { display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; }
    .etat { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: #E8EAED; line-height: 16px; }
    .chrono { display: flex; align-items: flex-start; gap: 4px; font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; color: #E8EAED; }
    .chrono b { font-size: 44px; font-weight: 300; letter-spacing: -0.03em; line-height: 44px; font-variant-numeric: tabular-nums; }
    .chrono sup { font-size: 13px; font-weight: 400; color: #9AA0A6; line-height: 13px; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .meta { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: #6B7178; line-height: 18px; }
    .puce { padding: 0 7px; border-radius: 6px; background: oklch(76.9% 0.166 70.1); color: #0D0E11; font-weight: 700; line-height: 18px; }
    .vignette { flex: none; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; background: #22252A;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.85), 0 6px 16px rgba(0,0,0,0.5); }
    .bande { flex: none; height: 44px; border-radius: 14px; background: oklch(76.9% 0.166 70.1); display: flex; align-items: center; justify-content: space-between;
      padding: 0 8px 0 14px; box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset; }
    .barres { display: flex; align-items: center; gap: 3px; height: 22px; }
    .barres i { display: block; width: 2px; border-radius: 2px; background: #0D0E11; }
    .rond { width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
  </style>
</helmet>
<div style="width: 440px; height: 260px; display: flex; align-items: center; justify-content: center;">
  <div class="widget">
    <div class="haut">
      <div class="infos">
        <div class="etat">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: oklch(64.5% 0.216 24.5); box-shadow: 0 0 8px oklch(64.5% 0.216 24.5 / 0.8);"></span>Enregistrement
        </div>
        <div class="chrono"><b>02:52</b><sup>26</sup></div>
        <div class="meta"><span>MP4</span><span>·</span><span>1280×720</span><span>·</span><span class="puce">≈ 45 Mo</span></div>
      </div>
      <div class="vignette" title="Aperçu webcam (invisible dans la vidéo)">
        <div style="width: 100%; height: 100%; background: radial-gradient(circle at 50% 38%, #C99A78 0 26%, transparent 27%), radial-gradient(ellipse at 50% 100%, #3B4A5C 0 45%, transparent 46%), linear-gradient(#2A2E34, #1A1C20);"></div>
      </div>
    </div>

    <div class="bande">
      <div class="barres">
        <i style="height: 6px;"></i><i style="height: 12px;"></i><i style="height: 18px;"></i><i style="height: 10px;"></i><i style="height: 16px;"></i><i style="height: 8px;"></i><i style="height: 14px;"></i><i style="height: 20px;"></i><i style="height: 9px;"></i><i style="height: 15px;"></i><i style="height: 7px;"></i><i style="height: 12px;"></i><i style="height: 18px;"></i><i style="height: 6px;"></i><i style="height: 11px;"></i><i style="height: 17px;"></i><i style="height: 9px;"></i><i style="height: 13px;"></i><i style="height: 5px;"></i><i style="height: 10px;"></i><i style="height: 16px;"></i><i style="height: 8px;"></i><i style="height: 6px;"></i><i style="height: 4px;"></i><i style="height: 5px;"></i><i style="height: 4px;"></i><i style="height: 3px;"></i><i style="height: 4px;"></i><i style="height: 3px;"></i><i style="height: 3px;"></i><i style="height: 4px;"></i><i style="height: 3px;"></i><i style="height: 3px;"></i><i style="height: 3px;"></i><i style="height: 3px;"></i><i style="height: 3px;"></i>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <div class="rond" style="background: rgba(13,14,17,0.18);" title="Pause">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#0D0E11"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </div>
        <div class="rond" style="background: #0D0E11; box-shadow: 0 2px 6px rgba(0,0,0,0.35);" title="Arrêter (F9)">
          <span style="width: 10px; height: 10px; border-radius: 2px; background: #E8EAED;"></span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
