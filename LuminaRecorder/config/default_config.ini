# Lumina Configuration File
# Generated automatically on first run

[general]
app_name = Lumina
version = 1.0.0
language = fr

[recording]
default_resolution = auto
default_fps = 30
default_bitrate = auto
audio_enabled = true
audio_gain = 0.5
# Pointeur dessiné dans la vidéo (mss ne le capture pas) et halo ambre
# à chaque clic. Le halo n'a d'effet que si le pointeur est visible.
cursor_visible = true
click_halo = true
# Raccourci global démarrer/arrêter. Formats acceptés : F9, Ctrl+F9,
# Ctrl+Shift+R... F9 par défaut car ni Windows ni les navigateurs ne
# l'utilisent, contrairement à F5, F11 ou F12.
hotkey = F9

[output]
save_directory = ~/Videos/Lumina
format = mp4
codec = h264

[ai]
smart_focus = false
clean_canvas = false
auto_subtitles = false
magic_cut = false

[privacy]
dynamic_blur = false
blur_keywords = password,secret,confidential

[system]
show_overlay = false
auto_profile = true

[webcam]
# Incrustation du visage. Jamais activée sans choix explicite.
enabled = false
device = 0
forme = rond
coin = bas-droite
taille = moyenne
miroir = true
