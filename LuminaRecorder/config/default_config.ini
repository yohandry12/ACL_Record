# Lumina Configuration File
# Generated automatically on first run

[general]
app_name = Lumina
version = 1.0.0
language = fr

[recording]
default_resolution = auto
default_fps = 30
default_bitrate = auto
audio_enabled = true
audio_gain = 0.5
cursor_visible = true

[output]
save_directory = ~/Videos/Lumina
format = mp4
codec = h264

[ai]
smart_focus = false
clean_canvas = false
auto_subtitles = false
magic_cut = false

[privacy]
dynamic_blur = false
blur_keywords = password,secret,confidential

[system]
show_overlay = false
auto_profile = true
